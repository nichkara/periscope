# What standard to use. This is optional and defaults to VHDL2008.
standard = "2008"
# File names are either absolute or relative to the parent folder of the vhdl_ls.toml file
[libraries]
defaultlib.files = [
    'src/*.vhd',
    'tb/tb_cpu.vhd'
]

[lint]
unused = 'error' # Upgrade the 'unused' diagnostic to the 'error' severity
unnecessary_work_library = true # Disable linting for the 'library work;' statement
