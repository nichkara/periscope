name: Run GHDL testbench
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [ubuntu-24.04]

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Update system
      run: |
        apt-get update -qy

    - name: Install dependencies
      run: |
        apt-get install -y make ghdl-gcc ghdl-tools gcc gcc-riscv64-linux-gnu tar xz-utils
        wget -O riscv32.tar.xz https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/2026.01.01/riscv32-elf-ubuntu-24.04-gcc.tar.xz
        tar xf riscv32.tar.xz
        cd riscv/bin/
        mv ./* /bin/

    - name: Memory verification
      run: |
        make simulation
        make memory_read_write

    - name: ALU verification
      run: |
        make alu
